name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout calc
        uses: actions/checkout@v4
        with:
          path: calc

      - name: Checkout neon-core
        uses: actions/checkout@v4
        with:
          repository: neoncorelabs/neon-core
          path: neon-core

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build
        working-directory: calc
        run: gradle assembleDebug
